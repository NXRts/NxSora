name: Build NxSora Windows (.exe & Installer)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows EXE & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Windows Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller pillow

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller nxsora.spec

      - name: Verify Standalone EXE Build
        shell: pwsh
        run: |
          if (Test-Path "dist\NxSora.exe") {
              Write-Host "NxSora.exe successfully built!" -ForegroundColor Green
              Get-Item "dist\NxSora.exe" | Select-Object Name, Length
          } else {
              Write-Error "dist\NxSora.exe not found!"
              exit 1
          }

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer (NxSora-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = "ISCC.exe"
          }
          & $iscc installer\setup.iss

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          if (Test-Path "dist\NxSora-Setup.exe") {
              Write-Host "NxSora-Setup.exe successfully compiled!" -ForegroundColor Green
              Get-Item "dist\NxSora-Setup.exe" | Select-Object Name, Length
          } else {
              Write-Error "dist\NxSora-Setup.exe not found!"
              exit 1
          }

      - name: Upload Standalone EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxSora-Windows-Standalone-EXE
          path: dist/NxSora.exe
          if-no-files-found: error

      - name: Upload Official Installer Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxSora-Windows-Setup-Installer
          path: dist/NxSora-Setup.exe
          if-no-files-found: error

      - name: Create GitHub Release and Upload Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NxSora-Setup.exe
            dist/NxSora.exe
          name: NxSora ${{ github.ref_name }} — The Living Sky-Notch
          body: |
            ## 🌌 NxSora (Nx空) — The Living Sky-Notch

            Selamat datang di rilis resmi **NxSora**! NxSora menghadirkan pengalaman antarmuka *Dynamic Island* modern, elegan, dan adaptif untuk Windows 10/11 dan Linux (KDE Plasma 6 Wayland).

            ### 📦 Pilihan Berkas Unduhan
            * **`NxSora-Setup.exe`** — **Official Installer (Rekomendasi)**: Setup wizard instalasi lengkap dengan shortcut Desktop, Start Menu, dan opsi autostart.
            * **`NxSora.exe`** — **Standalone Portable**: Siap pakai tanpa perlu instalasi. Cukup simpan di folder mana saja dan klik 2x untuk menjalankan.

            ### ✨ Fitur Unggulan
            * **Dynamic Topmost Overlay**: Menempel mulus di tengah atas layar tanpa muncul di Taskbar atau Alt+Tab.
            * **Now Playing & Synchronized Lyrics**: Terintegrasi dengan Windows Media Transport Controls (SMTC) & real-time lirik (.lrc).
            * **Pusat Kontrol Cepat**: Volume audio, kecerahan layar, status baterai & Bluetooth/TWS, serta status Wi-Fi.
            * **Jadwal Sholat & Sun Arc Trajectory**: Kalkulasi astronomi posisi matahari 100% offline (Kemenag RI), hitung mundur adzan, dan azan quiet pop-up.
            * **Produktivitas & Utilitas Pintar**: Shelf (rak berkas cepat), Clipboard History, Screen Color Picker, Quick Voice Note, dan To-Do reminder.
          generate_release_notes: true
          draft: false
          prerelease: false


