<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="soraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Capsule Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="#07070a" stroke="#24273a" stroke-width="3"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#voidGlow)"/>

  <!-- Celestial Arc (Sky / Sora) -->
  <path d="M 28 54 Q 64 24 100 54" fill="none" stroke="url(#soraGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Living Sky Eyes -->
  <circle cx="48" cy="72" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="80" cy="72" r="7" fill="#ffffff" filter="url(#glow)"/>

  <!-- Eye Cyan Reflection Spot -->
  <circle cx="50" cy="70" r="2.5" fill="#38bdf8"/>
  <circle cx="82" cy="70" r="2.5" fill="#38bdf8"/>

  <!-- Subtle Star Sparkle -->
  <circle cx="64" cy="38" r="2" fill="#fbbf24"/>
</svg>

